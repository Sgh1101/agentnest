name: android-screenshots

# Renders the Compose screens (including the 콩이 character) on an emulator and uploads the PNGs as an artifact, so the
# UI can be looked at, not just compiled. Test code: android/app/src/androidTest/kotlin/dev/agentnest/app/shots.
on:
  push:
    branches: ["ccr-*"]
  workflow_dispatch:

# least privilege: nothing here writes to the repository
permissions:
  contents: read

concurrency:
  group: android-screenshots-${{ github.sha }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: instrumented screenshot tests (API 34 emulator)
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6_pro
          ram-size: 4096M
          heap-size: 576M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Animations are NOT disabled on purpose: the tests control the character's motion themselves.
          disable-animations: false
          script: bash android/tools/run-screenshots.sh

      - name: screenshot summary
        if: always()
        run: |
          shopt -s nullglob
          files=(android/app/build/screenshots/*.png)
          echo "png count: ${#files[@]}"
          echo "gradle exit: $(cat android/app/build/screenshots/gradle-exit.txt 2>/dev/null || echo unknown)"

      - name: print selected screenshots to the log
        if: always()
        run: |
          python3 -m venv /tmp/shotsvenv
          /tmp/shotsvenv/bin/pip install --quiet pillow==11.3.0
          /tmp/shotsvenv/bin/python android/tools/emit_shots.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: |
            android/app/build/screenshots/
            android/app/build/reports/androidTests/
          if-no-files-found: warn

      - name: fail when the tests failed
        if: always()
        run: |
          code="$(cat android/app/build/screenshots/gradle-exit.txt 2>/dev/null || echo missing)"
          if [ "$code" != "0" ]; then echo "connectedDebugAndroidTest exit code: $code"; exit 1; fi
