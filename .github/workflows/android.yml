name: android

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-jvm:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: core unit tests (pure Kotlin JVM, no Android SDK)
        working-directory: android
        run: ./gradlew :core:test --no-daemon --console=plain

  app-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: app build, unit tests and lint
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: agentnest-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
