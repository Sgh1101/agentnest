name: rust

on:
  push:
    branches: [main, "ccr-*"]
  pull_request:

# least privilege: nothing here writes to the repository
permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop -> target"

      - name: fmt
        working-directory: desktop
        run: cargo fmt --all --check

      - name: clippy
        working-directory: desktop
        run: cargo clippy --locked --workspace --exclude agentnest-desktop --all-targets -- -D warnings

      - name: test (pure crates)
        working-directory: desktop
        run: cargo test --locked --workspace --exclude agentnest-desktop

      - name: test (adapter-api test-util constructors)
        working-directory: desktop
        run: cargo test --locked -p agentnest-adapter-api --features test-util

      - name: test (feature-flagged adapter code)
        working-directory: desktop
        run: cargo test --locked -p agentnest-core --features codex-daemon-observer,codex-rollout

      # `cargo check` never links, but ring and the bundled SQLite compile C in their build scripts. The MSVC CRT headers
      # are not available on Linux, so the shim compiles them with clang against the mingw-w64 headers
      # (desktop/tools/cc-msvc-check.sh, docs/testing-and-ci.md 2.1). llvm provides llvm-rc (Windows resources) and llvm-ar.
      - name: Tauri shell type check + clippy (windows msvc target, no link)
        working-directory: desktop
        env:
          CC_x86_64_pc_windows_msvc: ${{ github.workspace }}/desktop/tools/cc-msvc-check.sh
          AR_x86_64_pc_windows_msvc: llvm-ar
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang mingw-w64-x86-64-dev
          # tauri-build requires the bundled sidecar file to exist; an empty placeholder is enough without linking
          tools/prepare-hook-sidecar.sh --placeholder x86_64-pc-windows-msvc
          cargo check --locked -p agentnest-desktop --target x86_64-pc-windows-msvc
          cargo clippy --locked -p agentnest-desktop -p agentnest-shell-api --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: single crypto backend (no aws-lc-rs)
        working-directory: desktop
        run: |
          set -eu
          # the whole graph must resolve first, so that a cargo failure below cannot pass for "not found"
          cargo tree --locked --workspace --target all > /dev/null
          if out=$(cargo tree --locked --workspace --target all -i aws-lc-rs 2>&1); then
            echo "$out"
            echo "aws-lc-rs is in the dependency graph; ring must be the only backend" >&2
            exit 1
          fi
          # a failure that is not "package not in the graph" is a real error
          case "$out" in
            *"did not match any packages"*) ;;
            *) echo "$out" >&2; exit 1 ;;
          esac

      - name: exactly one Allow-reply creation site
        run: |
          set -eu
          mint=$(grep -rn 'ApplyProof::mint' desktop/crates | grep -v '/tests/' | grep -v 'cfg(test)' | grep -v 'test-util' | grep -v '^\S*:[0-9]*:\s*//' || true)
          echo "$mint"
          test "$(printf '%s\n' "$mint" | grep -c .)" -eq 1
          allow=$(grep -rn 'ApprovalReply::allow(' desktop/crates | grep -v '/tests/' | grep -v 'cfg(test)' | grep -v 'test-util' | grep -v '^\S*:[0-9]*:\s*//' || true)
          echo "$allow"
          test "$(printf '%s\n' "$allow" | grep -c .)" -le 1

      - name: release build must not enable adapter-api test-util
        working-directory: desktop
        run: |
          set -eu
          # a cargo failure must fail the step (no `2>/dev/null | grep`, which would read an error as "not enabled")
          tree=$(cargo tree --locked --workspace -e features -i agentnest-adapter-api)
          if grep -q 'test-util' <<< "$tree"; then
            echo "test-util feature is enabled in the default workspace graph" >&2
            exit 1
          fi
